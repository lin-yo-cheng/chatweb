<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>chatweb</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bg-fx" aria-hidden="true">
    <span class="bg-orb bg-orb-1"></span>
    <span class="bg-orb bg-orb-2"></span>
    <span class="bg-orb bg-orb-3"></span>
    <span class="bg-scanline"></span>
    <span class="bg-corner bg-corner-tl"></span>
    <span class="bg-corner bg-corner-tr"></span>
    <span class="bg-corner bg-corner-bl"></span>
    <span class="bg-corner bg-corner-br"></span>
  </div>

  <div id="loading-view">
    <div class="spinner"></div>
  </div>

  <div id="login-view" class="hidden">
    <form id="login-form">
      <h1>登入 chatweb</h1>
      <input id="login-email" type="text" placeholder="帳號 (email)" autocomplete="username" required />
      <input id="login-password" type="password" placeholder="密碼" autocomplete="current-password" required />
      <div id="login-error"></div>
      <button id="login-btn" type="submit">登入</button>
    </form>
  </div>

  <div id="app-view" class="hidden">
    <header>
      <h1>chatweb</h1>
      <div id="peer-status" class="hidden">
        <span id="peer-status-dot" class="status-dot"></span>
        <span id="peer-status-text"></span>
      </div>
      <button id="logout-btn">登出</button>
    </header>
    <div id="main-area">
      <div id="friend-list" class="hidden">
        <div id="friend-list-header">
          <button id="filter-btn" type="button" title="篩選清單">篩選</button>
          <button id="collapse-btn" type="button" title="收合清單">« 收合</button>
        </div>
        <div id="filter-panel" class="hidden"></div>
        <div id="friend-items"></div>
      </div>
      <div id="panel-divider" class="hidden"></div>
      <div id="chat-panel">
        <div id="chat-panel-header" class="hidden">
          <button id="show-list-btn" type="button">← 清單</button>
        </div>
        <div id="chat-placeholder">選擇一位朋友開始對話</div>
        <div id="chat-body" class="hidden">
          <div id="chat-background"></div>
          <video id="chat-background-video" class="hidden" autoplay loop muted playsinline></video>
          <div id="chat-background-fade"></div>
          <div id="message-list"></div>
        </div>
        <div id="image-preview" class="hidden">
          <img id="image-preview-img" alt="預覽圖片" />
          <span id="image-preview-name"></span>
          <button id="image-preview-cancel" type="button">×</button>
        </div>
        <div id="reply-preview" class="hidden">
          <div id="reply-preview-text"></div>
          <button id="reply-cancel-btn" type="button">×</button>
        </div>
        <div id="typing-indicator" class="hidden"></div>
        <form id="composer" class="hidden">
          <textarea id="text-input" rows="1" placeholder="輸入訊息…" autocomplete="off"></textarea>
          <label id="image-label" for="image-input">📷</label>
          <input id="image-input" type="file" accept="image/*" />
          <button id="send-btn" type="submit">送出</button>
        </form>
      </div>
    </div>
  </div>

  <div id="image-lightbox" class="hidden">
    <img id="image-lightbox-img" alt="圖片" />
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
